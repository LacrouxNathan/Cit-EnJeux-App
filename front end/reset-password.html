<!doctype html>
<html lang="fr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f3fbfd">
  <title>Réinitialiser mon mot de passe · Cité en jeux</title><link rel="icon" href="./logo_cej.png" type="image/png">
  <link rel="stylesheet" href="./styles.css"><script src="./reset-password.js" type="module"></script>
</head><body><div class="page-shell activation-shell">
  <header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="./logo_cej.png" width="3543" height="3288" alt=""><span>Cité en jeux</span></a></header>
  <main class="login-card"><h1>Un nouveau départ</h1><p class="welcome-copy">Choisissez un nouveau mot de passe. Vos anciennes sessions seront déconnectées après confirmation.</p>
    <form id="activation-form" method="post" action="/api/password-reset/confirm">
      <div class="field"><label for="new-password">Mot de passe (6 caractères minimum)</label><input id="new-password" type="password" autocomplete="new-password" minlength="6" required></div>
      <div class="field"><label for="confirm-password">Confirmez le mot de passe</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="submit-button" id="activate-submit" type="submit">Réinitialiser mon mot de passe</button>
    </form>
    <p id="activation-status" role="status" aria-live="polite"></p>
    <p><a href="/">Aller à la connexion</a></p>
  </main>
</div></body></html>
