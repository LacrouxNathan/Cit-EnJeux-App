spring.application.name=cej-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cej}
spring.datasource.username=${DB_USER:cej}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=CEJ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
cej.auth.max-attempts=${AUTH_MAX_ATTEMPTS:10}
cej.auth.window-seconds=${AUTH_WINDOW_SECONDS:900}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
cej.mail.from=${MAIL_FROM:noreply@citeenjeux.local}
cej.public-url=${PUBLIC_URL:http://localhost:8080}
cej.invitation.hours=${INVITATION_HOURS:48}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cej.bgg.token=${BGG_API_TOKEN:}
